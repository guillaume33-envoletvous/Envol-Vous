<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Envol & Vous | Voyages sur mesure</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Pacifico&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #0b6771;
    }

    /* PAGE D'ACCUEIL */

    .hero {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      color: white;

      /*
        Nous ajouterons la vraie photo tropicale
        à l'étape suivante.
      */

      background:
        linear-gradient(
          90deg,
          rgba(0, 45, 60, 0.48) 0%,
          rgba(0, 45, 60, 0.15) 50%,
          rgba(0, 45, 60, 0.08) 100%
        ),
        linear-gradient(
          135deg,
          #007c91,
          #00a9a5 45%,
          #0a7f62
        );

      background-size: cover;
      background-position: center;
    }

    /* MENU */

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5%;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: white;
    }

    /* TAMPON DE VOYAGE */

    .stamp {
      width: 82px;
      height: 82px;
      border: 3px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform: rotate(-7deg);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.18);
    }

    .stamp::before {
      content: "ENVOL & VOUS";
      position: absolute;
      top: 8px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.3px;
    }

    .stamp::after {
      content: "VOYAGE";
      position: absolute;
      bottom: 8px;
      font-size: 8px;
      letter-spacing: 2px;
    }

    .stamp-icon {
      font-size: 31px;
      transform: rotate(7deg);
    }

    .brand-name {
      font-family: "Pacifico", cursive;
      font-size: clamp(28px, 3vw, 48px);
      font-weight: 400;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.75;
    }

    nav .nav-button {
      border: 2px solid #f4bb43;
      border-radius: 12px;
      padding: 13px 20px;
    }

    /* CONTENU CENTRAL */

    .hero-content {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4% 7%;
    }

    .hero-text {
      max-width: 720px;
      margin-top: 60px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(50px, 6.5vw, 94px);
      line-height: 0.98;
      font-weight: 500;
      text-shadow: 0 3px 20px rgba(0,0,0,0.2);
    }

    .highlight {
      display: block;
      font-family: "Pacifico", cursive;
      color: #f5bd4b;
      font-size: 0.73em;
      font-weight: 400;
      margin-top: 12px;
      line-height: 1.2;
    }

    .description {
      margin-top: 32px;
      max-width: 560px;
      font-size: clamp(17px, 1.4vw, 21px);
      line-height: 1.55;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .main-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      padding: 17px 25px;
      background: #f5bd4b;
      color: #263238;
      border-radius: 11px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .main-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 30px rgba(0,0,0,0.25);
    }

    /* MOBILE */

    .menu-mobile {
      display: none;
      font-size: 30px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 850px) {

      header {
        padding: 18px 5%;
      }

      .stamp {
        width: 58px;
        height: 58px;
      }

      .stamp::before {
        font-size: 6px;
        top: 5px;
      }

      .stamp::after {
        font-size: 6px;
        bottom: 5px;
      }

      .stamp-icon {
        font-size: 22px;
      }

      .brand-name {
        font-size: 27px;
      }

      nav {
        display: none;
      }

      .menu-mobile {
        display: block;
      }

      .hero-content {
        padding: 30px 7% 70px;
        align-items: flex-end;
      }

      .hero-text {
        margin-top: 0;
      }

      h1 {
        font-size: clamp(48px, 13vw, 70px);
      }

      .description {
        font-size: 17px;
        margin-top: 25px;
      }
    }

  </style>
</head>

<body>

  <section class="hero">

    <header>

      <a href="index.html" class="brand">

        <div class="stamp">
          <span class="stamp-icon">✈</span>
        </div>

        <span class="brand-name">
          Envol & Vous
        </span>

      </a>

      <nav>
        <a href="a-propos.html">À propos</a>
        <a href="destinations.html">Destination</a>
        <a href="formules.html">Nos formules</a>
        <a href="creer-mon-voyage.html" class="nav-button">
          Créer mon voyage
        </a>
      </nav>

      <button class="menu-mobile" aria-label="Ouvrir le menu">
        ☰
      </button>

    </header>

    <main class="hero-content">

      <div class="hero-text">

        <h1>
          Votre voyage,
          <span class="highlight">
            imaginé pour vous
          </span>
        </h1>

        <p class="description">
          Des voyages sur mesure, conçus selon vos envies,
          pour des souvenirs inoubliables.
        </p>

        <a href="creer-mon-voyage.html" class="main-button">
          ✈ &nbsp; Créer mon voyage
        </a>

      </div>

    </main>

  </section>

</body>
</html>
